<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Stage progression and per-stage state machine">
  <defs>
    <style>
      .sm-bg{fill:#f8fafc}
      .sm-card{fill:#fff;stroke:#dbe5ee;stroke-width:1.4}
      .sm-pending{fill:#fff;stroke:#94a3b8;stroke-width:1.6}
      .sm-running{fill:#e9fbfb;stroke:#4dbab9;stroke-width:1.6}
      .sm-succeeded{fill:#ecfdf5;stroke:#10b981;stroke-width:1.6}
      .sm-needs{fill:#fff7ed;stroke:#f97316;stroke-width:1.6}
      .sm-failed{fill:#fef2f2;stroke:#ef4444;stroke-width:1.6}
      .sm-skipped{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
      .sm-done{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .sm-h{font:700 12px Inter,Arial,sans-serif;fill:#0f172a}
      .sm-t{font:500 10px Inter,Arial,sans-serif;fill:#475569}
      .sm-sec{font:600 10px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:0.06em;text-transform:uppercase}
      .sm-state{font:700 13px Inter,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .sm-sub{font:500 9.5px Inter,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .sm-lbl{font:500 10px Inter,Arial,sans-serif;fill:#475569;font-style:italic}
      .sm-good{stroke:#10b981;stroke-width:1.6;fill:none;marker-end:url(#smArG)}
      .sm-warn{stroke:#f97316;stroke-width:1.6;fill:none;marker-end:url(#smArW)}
      .sm-bad{stroke:#ef4444;stroke-width:1.6;fill:none;marker-end:url(#smArB)}
      .sm-blk{stroke:#0f172a;stroke-width:1.4;fill:none;marker-end:url(#smArK)}
      .sm-teal{stroke:#4dbab9;stroke-width:1.8;fill:none;marker-end:url(#smArT)}
    </style>
    <marker id="smArG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#10b981"/></marker>
    <marker id="smArW" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#f97316"/></marker>
    <marker id="smArB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#ef4444"/></marker>
    <marker id="smArK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#0f172a"/></marker>
    <marker id="smArT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#4dbab9"/></marker>
    <filter id="smSh" x="-8%" y="-8%" width="116%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/></filter>
  </defs>
  <rect class="sm-bg" width="820" height="420"/>

  <text x="14" y="22" class="sm-sec">Stage Progression</text>
  <line x1="14" y1="30" x2="806" y2="30" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <rect x="14" y="40" width="118" height="44" rx="9" class="sm-card" filter="url(#smSh)"/>
  <text x="28" y="60" class="sm-h">1 · intake</text>
  <text x="28" y="76" class="sm-t">Apify → R2</text>

  <rect x="143" y="40" width="118" height="44" rx="9" class="sm-card" filter="url(#smSh)"/>
  <text x="157" y="60" class="sm-h">2 · anchor</text>
  <text x="157" y="76" class="sm-t">ffmpeg</text>

  <rect x="272" y="40" width="118" height="44" rx="9" class="sm-card" filter="url(#smSh)"/>
  <text x="286" y="60" class="sm-h">3 · image_gen</text>
  <text x="286" y="76" class="sm-t">WaveSpeed</text>

  <rect x="401" y="40" width="118" height="44" rx="9" class="sm-card" filter="url(#smSh)"/>
  <text x="415" y="60" class="sm-h">4 · motion</text>
  <text x="415" y="76" class="sm-t">WS / Kling</text>

  <rect x="530" y="40" width="118" height="44" rx="9" class="sm-card" filter="url(#smSh)"/>
  <text x="544" y="60" class="sm-h">5 · finalize</text>
  <text x="544" y="76" class="sm-t">persist + done</text>

  <rect x="659" y="40" width="118" height="44" rx="9" class="sm-done" filter="url(#smSh)"/>
  <text x="718" y="60" class="sm-state">done</text>
  <text x="718" y="76" class="sm-sub">item terminal</text>

  <line x1="132" y1="62" x2="143" y2="62" class="sm-teal"/>
  <line x1="261" y1="62" x2="272" y2="62" class="sm-teal"/>
  <line x1="390" y1="62" x2="401" y2="62" class="sm-teal"/>
  <line x1="519" y1="62" x2="530" y2="62" class="sm-teal"/>
  <line x1="648" y1="62" x2="659" y2="62" class="sm-teal"/>

  <text x="14" y="116" class="sm-sec">Per-Stage State Machine</text>
  <line x1="14" y1="124" x2="806" y2="124" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <rect x="20" y="200" width="130" height="56" rx="28" class="sm-pending" filter="url(#smSh)"/>
  <text x="85" y="226" class="sm-state">pending</text>
  <text x="85" y="242" class="sm-sub">awaiting worker</text>

  <rect x="220" y="200" width="130" height="56" rx="28" class="sm-running" filter="url(#smSh)"/>
  <text x="285" y="226" class="sm-state">running</text>
  <text x="285" y="242" class="sm-sub">dispatched, awaiting</text>

  <rect x="420" y="148" width="190" height="50" rx="25" class="sm-succeeded" filter="url(#smSh)"/>
  <text x="515" y="172" class="sm-state">succeeded</text>
  <text x="515" y="188" class="sm-sub">advance stage / done</text>

  <rect x="420" y="212" width="190" height="50" rx="25" class="sm-needs" filter="url(#smSh)"/>
  <text x="515" y="236" class="sm-state">needs_operator</text>
  <text x="515" y="252" class="sm-sub">surfaced to UI</text>

  <rect x="420" y="276" width="190" height="50" rx="25" class="sm-failed" filter="url(#smSh)"/>
  <text x="515" y="300" class="sm-state">failed</text>
  <text x="515" y="316" class="sm-sub">retry candidate</text>

  <rect x="640" y="276" width="160" height="50" rx="25" class="sm-skipped" filter="url(#smSh)"/>
  <text x="720" y="300" class="sm-state">skipped</text>
  <text x="720" y="316" class="sm-sub">chain exhausted</text>

  <line x1="150" y1="228" x2="220" y2="228" class="sm-blk"/>
  <text x="156" y="220" class="sm-lbl">worker leases · attempt++</text>

  <path d="M345 210 Q380 192 420 175" class="sm-good"/>
  <text x="354" y="190" class="sm-lbl">ok</text>

  <line x1="350" y1="232" x2="420" y2="236" class="sm-warn"/>
  <text x="356" y="228" class="sm-lbl">low_score · safety · unknown</text>

  <path d="M345 250 Q380 268 420 294" class="sm-bad"/>
  <text x="354" y="280" class="sm-lbl">transient · input_invalid</text>

  <path d="M420 308 Q230 360 85 256" class="sm-bad"/>
  <text x="210" y="350" class="sm-lbl">retry · exp backoff · ≤3 attempts</text>

  <line x1="610" y1="301" x2="640" y2="301" class="sm-bad"/>
  <text x="608" y="294" class="sm-lbl">chain exhausted + skip</text>

  <text x="14" y="400" class="sm-lbl">Resume rule · if provider_job_id present, poll it; else re-dispatch with new idempotency key. Append-only attempts make this safe at any boot.</text>
</svg>
