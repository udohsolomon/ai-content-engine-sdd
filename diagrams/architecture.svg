<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" role="img" aria-label="Architecture: stage-per-queue pipeline">
  <defs>
    <style>
      .a-bg{fill:#f8fafc}
      .a-card{fill:#fff;stroke:#dbe5ee;stroke-width:1.4}
      .a-lane{fill:#effafa;stroke:#9dd5d6;stroke-width:1.4}
      .a-store{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.4}
      .a-warn{fill:#fff7ed;stroke:#fed7aa;stroke-width:1.4}
      .a-h{font:700 12px Inter,Arial,sans-serif;fill:#0f172a}
      .a-t{font:500 10.5px Inter,Arial,sans-serif;fill:#475569}
      .a-sec{font:600 10px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:0.06em;text-transform:uppercase}
      .a-num{font:800 10px Inter,Arial,sans-serif;fill:#fff}
      .a-teal{fill:#4dbab9}
      .a-line{stroke:#4dbab9;stroke-width:1.8;fill:none;marker-end:url(#aArrT)}
      .a-dash{stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:4 4;fill:none;marker-end:url(#aArrG)}
    </style>
    <marker id="aArrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#4dbab9"/></marker>
    <marker id="aArrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#94a3b8"/></marker>
    <filter id="aSh" x="-8%" y="-8%" width="116%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/></filter>
  </defs>
  <rect class="a-bg" width="820" height="480"/>

  <text x="14" y="22" class="a-sec">1 · Intake &amp; Selection</text>
  <line x1="14" y1="30" x2="806" y2="30" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <rect x="14" y="40" width="145" height="82" rx="9" class="a-card" filter="url(#aSh)"/>
  <circle cx="32" cy="60" r="9" class="a-teal"/><text x="28" y="64" class="a-num">1</text>
  <text x="48" y="64" class="a-h">Sources</text>
  <text x="28" y="84" class="a-t">Approved accounts</text>
  <text x="28" y="100" class="a-t">Per-brand allow-list</text>

  <rect x="175" y="40" width="145" height="82" rx="9" class="a-card" filter="url(#aSh)"/>
  <circle cx="193" cy="60" r="9" class="a-teal"/><text x="189" y="64" class="a-num">2</text>
  <text x="209" y="64" class="a-h">Apify Intake</text>
  <text x="189" y="84" class="a-t">Actor runs · cron</text>
  <text x="189" y="100" class="a-t">Copy-on-pull</text>

  <rect x="336" y="40" width="145" height="82" rx="9" class="a-store" filter="url(#aSh)"/>
  <circle cx="354" cy="60" r="9" class="a-teal"/><text x="350" y="64" class="a-num">3</text>
  <text x="370" y="64" class="a-h">R2 Source</text>
  <text x="350" y="84" class="a-t">Content-addressed</text>
  <text x="350" y="100" class="a-t">sha256 · immutable</text>

  <rect x="497" y="40" width="145" height="82" rx="9" class="a-card" filter="url(#aSh)"/>
  <circle cx="515" cy="60" r="9" class="a-teal"/><text x="511" y="64" class="a-num">4</text>
  <text x="531" y="64" class="a-h">Operator Console</text>
  <text x="511" y="84" class="a-t">Preview &amp; select</text>
  <text x="511" y="100" class="a-t">Pool × brand matrix</text>

  <rect x="658" y="40" width="148" height="82" rx="9" class="a-lane" filter="url(#aSh)"/>
  <circle cx="676" cy="60" r="9" class="a-teal"/><text x="672" y="64" class="a-num">5</text>
  <text x="692" y="64" class="a-h">Batch Planner</text>
  <text x="672" y="84" class="a-t">Pin prompt + identity</text>
  <text x="672" y="100" class="a-t">Pre-flight cost cap</text>

  <line x1="159" y1="80" x2="175" y2="80" class="a-line"/>
  <line x1="320" y1="80" x2="336" y2="80" class="a-line"/>
  <line x1="481" y1="80" x2="497" y2="80" class="a-line"/>
  <line x1="642" y1="80" x2="658" y2="80" class="a-line"/>

  <text x="14" y="156" class="a-sec">2 · Worker Pipeline · stage queues · per-provider concurrency</text>
  <line x1="14" y1="164" x2="806" y2="164" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <rect x="14" y="174" width="130" height="104" rx="9" class="a-lane" filter="url(#aSh)"/>
  <text x="28" y="194" class="a-h">Worker Queues</text>
  <text x="28" y="212" class="a-t">graphile-worker</text>
  <text x="28" y="226" class="a-t">Pool per stage</text>
  <text x="28" y="240" class="a-t">DLQ per stage</text>
  <text x="28" y="254" class="a-t">Per-provider sem.</text>
  <text x="28" y="268" class="a-t">Idempotency keys</text>

  <rect x="160" y="174" width="124" height="104" rx="9" class="a-card" filter="url(#aSh)"/>
  <text x="172" y="194" class="a-h">intake</text>
  <text x="172" y="214" class="a-t">Apify → R2</text>
  <text x="172" y="230" class="a-t">checksum</text>
  <text x="172" y="254" class="a-t" font-style="italic" fill="#94a3b8">copy-on-pull</text>

  <rect x="296" y="174" width="124" height="104" rx="9" class="a-card" filter="url(#aSh)"/>
  <text x="308" y="194" class="a-h">anchor</text>
  <text x="308" y="214" class="a-t">ffmpeg (pinned)</text>
  <text x="308" y="230" class="a-t">score frames 0–15</text>
  <text x="308" y="254" class="a-t" font-style="italic" fill="#94a3b8">picks best frame</text>

  <rect x="432" y="174" width="124" height="104" rx="9" class="a-card" filter="url(#aSh)"/>
  <text x="444" y="194" class="a-h">image_gen</text>
  <text x="444" y="214" class="a-t">WaveSpeed</text>
  <text x="444" y="230" class="a-t">NBP → Flux → SD</text>
  <text x="444" y="254" class="a-t" font-style="italic" fill="#94a3b8">+ ArcFace eval</text>

  <rect x="568" y="174" width="124" height="104" rx="9" class="a-card" filter="url(#aSh)"/>
  <text x="580" y="194" class="a-h">motion</text>
  <text x="580" y="214" class="a-t">WS / Kling v3</text>
  <text x="580" y="230" class="a-t">async + webhook</text>
  <text x="580" y="254" class="a-t" font-style="italic" fill="#94a3b8">long-TTL signed</text>

  <rect x="704" y="174" width="102" height="104" rx="9" class="a-card" filter="url(#aSh)"/>
  <text x="716" y="194" class="a-h">finalize</text>
  <text x="716" y="214" class="a-t">persist R2 key</text>
  <text x="716" y="230" class="a-t">mark done</text>
  <text x="716" y="254" class="a-t" font-style="italic" fill="#94a3b8">cost_spent</text>

  <line x1="144" y1="226" x2="160" y2="226" class="a-line"/>
  <line x1="284" y1="226" x2="296" y2="226" class="a-line"/>
  <line x1="420" y1="226" x2="432" y2="226" class="a-line"/>
  <line x1="556" y1="226" x2="568" y2="226" class="a-line"/>
  <line x1="692" y1="226" x2="704" y2="226" class="a-line"/>

  <text x="14" y="306" class="a-sec">3 · Control Plane · Async Coordination · Storage · Observability</text>
  <line x1="14" y1="314" x2="806" y2="314" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3"/>

  <rect x="14" y="324" width="192" height="140" rx="9" class="a-store" filter="url(#aSh)"/>
  <text x="28" y="344" class="a-h">Postgres Control Plane</text>
  <text x="28" y="364" class="a-t">batch · batch_item</text>
  <text x="28" y="380" class="a-t">batch_item_attempt</text>
  <text x="28" y="396" class="a-t">prompt_version</text>
  <text x="28" y="412" class="a-t">identity_version</text>
  <text x="28" y="428" class="a-t">provider_event_inbox</text>
  <text x="28" y="444" class="a-t">operator_action</text>
  <text x="28" y="458" class="a-t" font-style="italic" fill="#94a3b8">append-only attempts</text>

  <rect x="216" y="324" width="192" height="140" rx="9" class="a-store" filter="url(#aSh)"/>
  <text x="230" y="344" class="a-h">R2 Object Storage</text>
  <text x="230" y="364" class="a-t">Source clips (immutable)</text>
  <text x="230" y="380" class="a-t">Anchor frames</text>
  <text x="230" y="396" class="a-t">Regenerated frames</text>
  <text x="230" y="412" class="a-t">Motion outputs</text>
  <text x="230" y="428" class="a-t">Identity refs (encrypted)</text>
  <text x="230" y="458" class="a-t" font-style="italic" fill="#94a3b8">content-addressed keys</text>

  <rect x="418" y="324" width="192" height="140" rx="9" class="a-card" filter="url(#aSh)"/>
  <text x="432" y="344" class="a-h">Async Coordination</text>
  <text x="432" y="364" class="a-t">Webhook receiver</text>
  <text x="432" y="380" class="a-t">HMAC verify · dedupe</text>
  <text x="432" y="396" class="a-t">Inbox consumer</text>
  <text x="442" y="410" class="a-t">(SKIP LOCKED)</text>
  <text x="432" y="426" class="a-t">Reconciler cron · 30–60s</text>
  <text x="432" y="442" class="a-t">Polls open job_ids</text>
  <text x="432" y="458" class="a-t" font-style="italic" fill="#94a3b8">webhook fast / poll truth</text>

  <rect x="620" y="324" width="186" height="140" rx="9" class="a-warn" filter="url(#aSh)"/>
  <text x="634" y="344" class="a-h">Observability &amp; Security</text>
  <text x="634" y="364" class="a-t">Queue depth + age</text>
  <text x="634" y="380" class="a-t">Per-provider error rate</text>
  <text x="634" y="396" class="a-t">Identity score trend</text>
  <text x="634" y="412" class="a-t">Credit balance</text>
  <text x="634" y="428" class="a-t">Webhook lag</text>
  <text x="634" y="444" class="a-t">Per-brand provider ACL</text>
  <text x="634" y="458" class="a-t" font-style="italic" fill="#94a3b8">alerts on drift &amp; spend</text>

  <line x1="76" y1="278" x2="76" y2="324" class="a-dash"/>
  <line x1="312" y1="278" x2="312" y2="324" class="a-dash"/>
  <line x1="494" y1="278" x2="494" y2="324" class="a-dash"/>
  <line x1="712" y1="278" x2="712" y2="324" class="a-dash"/>
</svg>
