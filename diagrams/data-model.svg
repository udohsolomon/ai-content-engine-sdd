<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-label="Data model: entity relationships">
  <defs>
    <style>
      .d-bg{fill:#f8fafc}
      .d-tbl{fill:#fff;stroke:#dbe5ee;stroke-width:1.4}
      .d-tblImm{fill:#fff;stroke:#a7f3d0;stroke-width:1.4}
      .d-tblInb{fill:#fff;stroke:#9dd5d6;stroke-width:1.4}
      .d-tblAud{fill:#fff;stroke:#fed7aa;stroke-width:1.4}
      .d-hdr{fill:#0f172a}
      .d-hdrImm{fill:#065f46}
      .d-hdrInb{fill:#0e7490}
      .d-hdrAud{fill:#9a3412}
      .d-hname{font:700 12px Inter,Arial,sans-serif;fill:#fff}
      .d-htag{font:600 9px Inter,Arial,sans-serif;fill:#cbd5e1;letter-spacing:0.06em}
      .d-col{font:500 10px ui-monospace,Menlo,monospace;fill:#334155}
      .d-pk{font:700 10px ui-monospace,Menlo,monospace;fill:#0f172a}
      .d-fk{font:600 10px ui-monospace,Menlo,monospace;fill:#b34700}
      .d-lbl{font:600 10px Inter,Arial,sans-serif;fill:#0f172a}
      .d-rel{stroke:#4dbab9;stroke-width:1.6;fill:none;marker-end:url(#dArrT)}
      .d-relSoft{stroke:#94a3b8;stroke-width:1.3;fill:none;stroke-dasharray:4 4;marker-end:url(#dArrG)}
      .d-legend{font:500 10px Inter,Arial,sans-serif;fill:#334155}
    </style>
    <marker id="dArrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#4dbab9"/></marker>
    <marker id="dArrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M2 2 L7 4.5 L2 7 Z" fill="#94a3b8"/></marker>
    <filter id="dSh" x="-8%" y="-8%" width="116%" height="125%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/></filter>
  </defs>
  <rect class="d-bg" width="820" height="620"/>

  <rect x="540" y="10" width="270" height="44" rx="4" fill="#fff" stroke="#dbe5ee"/>
  <rect x="552" y="22" width="12" height="10" rx="2" class="d-tblImm"/>
  <text x="570" y="32" class="d-legend">immutable</text>
  <rect x="638" y="22" width="12" height="10" rx="2" class="d-tblInb"/>
  <text x="656" y="32" class="d-legend">inbox</text>
  <rect x="700" y="22" width="12" height="10" rx="2" class="d-tblAud"/>
  <text x="718" y="32" class="d-legend">audit</text>
  <text x="552" y="48" class="d-pk">★</text>
  <text x="562" y="48" class="d-legend">PK</text>
  <text x="586" y="48" class="d-fk">→</text>
  <text x="600" y="48" class="d-legend">FK</text>
  <line x1="630" y1="46" x2="650" y2="46" class="d-rel"/>
  <text x="654" y="50" class="d-legend">hard</text>
  <line x1="688" y1="46" x2="708" y2="46" class="d-relSoft"/>
  <text x="712" y="50" class="d-legend">soft / poly</text>

  <g transform="translate(14,80)">
    <rect width="155" height="98" rx="6" class="d-tbl" filter="url(#dSh)"/>
    <rect width="155" height="24" rx="6" class="d-hdr"/>
    <rect y="18" width="155" height="6" class="d-hdr"/>
    <text x="10" y="16" class="d-hname">brand</text>
    <text x="120" y="14" class="d-htag">CORE</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-col">name</text>
    <text x="10" y="76" class="d-col">tier (1|2|3)</text>
    <text x="10" y="92" class="d-col">fallback_policy</text>
  </g>

  <g transform="translate(189,80)">
    <rect width="195" height="98" rx="6" class="d-tblImm" filter="url(#dSh)"/>
    <rect width="195" height="24" rx="6" class="d-hdrImm"/>
    <rect y="18" width="195" height="6" class="d-hdrImm"/>
    <text x="10" y="16" class="d-hname">identity_version</text>
    <text x="146" y="14" class="d-htag">IMMUT.</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-fk">→ brand_id</text>
    <text x="10" y="76" class="d-col">reference_image_keys[]</text>
    <text x="10" y="92" class="d-col">reference_embeddings[]</text>
  </g>

  <g transform="translate(404,80)">
    <rect width="180" height="98" rx="6" class="d-tbl" filter="url(#dSh)"/>
    <rect width="180" height="24" rx="6" class="d-hdr"/>
    <rect y="18" width="180" height="6" class="d-hdr"/>
    <text x="10" y="16" class="d-hname">source_clip</text>
    <text x="140" y="14" class="d-htag">MEDIA</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-col">r2_key, sha256</text>
    <text x="10" y="76" class="d-col">anchor_frame_idx</text>
    <text x="10" y="92" class="d-col">status, duration_ms</text>
  </g>

  <g transform="translate(604,80)">
    <rect width="202" height="98" rx="6" class="d-tblImm" filter="url(#dSh)"/>
    <rect width="202" height="24" rx="6" class="d-hdrImm"/>
    <rect y="18" width="202" height="6" class="d-hdrImm"/>
    <text x="10" y="16" class="d-hname">prompt_version</text>
    <text x="150" y="14" class="d-htag">IMMUT.</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-col">provider, stage</text>
    <text x="10" y="76" class="d-col">template, params jsonb</text>
    <text x="10" y="92" class="d-col">status (draft|active|archived)</text>
  </g>

  <line x1="169" y1="115" x2="189" y2="115" class="d-rel"/>
  <text x="171" y="108" class="d-lbl">1:N</text>

  <g transform="translate(290,220)">
    <rect width="240" height="120" rx="6" class="d-tbl" filter="url(#dSh)"/>
    <rect width="240" height="24" rx="6" class="d-hdr"/>
    <rect y="18" width="240" height="6" class="d-hdr"/>
    <text x="10" y="16" class="d-hname">batch</text>
    <text x="166" y="14" class="d-htag">OPERATIONAL</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-col">operator_id, source_pool_id</text>
    <text x="10" y="76" class="d-fk">→ identity_version_ids jsonb</text>
    <text x="10" y="92" class="d-fk">→ image_prompt_version_id</text>
    <text x="10" y="108" class="d-fk">→ motion_prompt_version_id</text>
  </g>

  <path d="M286 178 Q286 200 320 220" class="d-rel"/>
  <text x="230" y="196" class="d-lbl">pinned per brand</text>

  <path d="M704 178 Q704 200 510 220" class="d-rel"/>
  <text x="588" y="200" class="d-lbl">×2 (image, motion)</text>

  <g transform="translate(290,380)">
    <rect width="240" height="106" rx="6" class="d-tbl" filter="url(#dSh)"/>
    <rect width="240" height="24" rx="6" class="d-hdr"/>
    <rect y="18" width="240" height="6" class="d-hdr"/>
    <text x="10" y="16" class="d-hname">batch_item</text>
    <text x="156" y="14" class="d-htag">OPERATIONAL</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-fk">→ batch_id, clip_id, brand_id</text>
    <text x="10" y="76" class="d-fk">→ identity_version_id</text>
    <text x="10" y="92" class="d-col">status, current_stage, attempt_no</text>
  </g>

  <line x1="410" y1="340" x2="410" y2="380" class="d-rel"/>
  <text x="416" y="364" class="d-lbl">1:N</text>

  <path d="M494 178 Q494 280 524 380" class="d-rel"/>
  <text x="498" y="280" class="d-lbl">N:1</text>

  <g transform="translate(40,520)">
    <rect width="320" height="90" rx="6" class="d-tbl" filter="url(#dSh)"/>
    <rect width="320" height="24" rx="6" class="d-hdr"/>
    <rect y="18" width="320" height="6" class="d-hdr"/>
    <text x="10" y="16" class="d-hname">batch_item_attempt</text>
    <text x="220" y="14" class="d-htag">APPEND-ONLY</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-fk">→ batch_item_id, provider, provider_job_id</text>
    <text x="10" y="76" class="d-col">prompt_resolved_hash, identity_score, error_class</text>
  </g>

  <path d="M340 486 Q340 510 250 520" class="d-rel"/>
  <text x="276" y="510" class="d-lbl">1:N</text>

  <g transform="translate(390,520)">
    <rect width="220" height="90" rx="6" class="d-tblInb" filter="url(#dSh)"/>
    <rect width="220" height="24" rx="6" class="d-hdrInb"/>
    <rect y="18" width="220" height="6" class="d-hdrInb"/>
    <text x="10" y="16" class="d-hname">provider_event_inbox</text>
    <text x="172" y="14" class="d-htag">INBOX</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-col">provider, event_id (UNIQUE)</text>
    <text x="10" y="76" class="d-col">signature_verified, payload</text>
  </g>

  <line x1="390" y1="555" x2="360" y2="555" class="d-relSoft"/>
  <text x="362" y="548" class="d-lbl">soft, by provider_job_id</text>

  <g transform="translate(640,520)">
    <rect width="166" height="90" rx="6" class="d-tblAud" filter="url(#dSh)"/>
    <rect width="166" height="24" rx="6" class="d-hdrAud"/>
    <rect y="18" width="166" height="6" class="d-hdrAud"/>
    <text x="10" y="16" class="d-hname">operator_action</text>
    <text x="124" y="14" class="d-htag">AUDIT</text>
    <text x="10" y="44" class="d-pk">★ id</text>
    <text x="10" y="60" class="d-col">operator_id</text>
    <text x="10" y="76" class="d-col">target (poly), action</text>
  </g>

  <path d="M640 540 Q540 470 410 460" class="d-relSoft"/>
  <text x="500" y="490" class="d-lbl">poly ref → batch, batch_item, identity_version…</text>
</svg>
